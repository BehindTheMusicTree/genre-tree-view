name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 22.23.2

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm coverage

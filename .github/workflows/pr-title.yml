# Own workflow: the `edited` trigger must not rerun the test suite.
name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    uses: BehindTheMusicTree/github-workflows/.github/workflows/pr-title.yml@c1c5d1c8e36902d83e60fb5188e83bf7660c034b

name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"

env:
  NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN_READ }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @behindthemusictree/genre-tree-view run build

      - run: pnpm --filter @behindthemusictree/genre-tree-view publish --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

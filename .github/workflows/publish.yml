name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read

# Keep every main push so a newer run cannot replace a pending release.
concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tag:
    permissions:
      contents: write
    uses: BehindTheMusicTree/github-workflows/.github/workflows/release-tag.yml@c1c5d1c8e36902d83e60fb5188e83bf7660c034b
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      release-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  publish:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout release foundation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: BehindTheMusicTree/github-workflows
          ref: c1c5d1c8e36902d83e60fb5188e83bf7660c034b
          path: .release-foundation
          persist-credentials: false

      - name: Validate tag and release notes
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: python3 .release-foundation/release/github-release.py notes "$RUNNER_TEMP/release-notes.md"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @behindthemusictree/genre-tree-view run build

      # pnpm pack rewrites workspace:/catalog: specifiers. The trusted publisher on npmjs must allow
      # direct `npm publish` (Allow npm publish), otherwise this step fails with ENEEDAUTH.
      - run: npm install -g npm@11.21.1
      - run: pnpm --filter @behindthemusictree/genre-tree-view pack --pack-destination "$RUNNER_TEMP"
      - name: Check existing npm artifact
        id: registry
        run: node .release-foundation/release/npm-artifact.cjs @behindthemusictree/genre-tree-view "$(node -p "require('./packages/genre-tree-view/package.json').version")" "$RUNNER_TEMP"/behindthemusictree-genre-tree-view-*.tgz
      - if: steps.registry.outputs.exists != 'true'
        run: npm publish "$RUNNER_TEMP"/behindthemusictree-genre-tree-view-*.tgz --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-please:
    needs: [tag, publish]
    # Ordinary pushes have no tag, so publication is skipped and reconciliation still runs.
    if: ${{ !cancelled() && needs.tag.result == 'success' && (needs.tag.outputs.tag == '' || needs.publish.result == 'success') }}
    uses: BehindTheMusicTree/github-workflows/.github/workflows/release-please.yml@c1c5d1c8e36902d83e60fb5188e83bf7660c034b
    with:
      app-id: ${{ vars.RELEASE_PR_APP_ID }}
      auto-merge: true
      release-policies: .github/release-policy.json
    secrets:
      release-pr-app-private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}

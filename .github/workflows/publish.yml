name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @behindthemusictree/genre-tree-view run build

      # pnpm pack rewrites workspace:/catalog: specifiers. The trusted publisher only allows staging:
      # a maintainer must approve the version with 2FA (npm stage approve) before it goes live.
      - run: npm install -g npm@11.21.1
      - run: pnpm --filter @behindthemusictree/genre-tree-view pack --pack-destination "$RUNNER_TEMP"
      - run: npm stage publish "$RUNNER_TEMP"/behindthemusictree-genre-tree-view-*.tgz --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

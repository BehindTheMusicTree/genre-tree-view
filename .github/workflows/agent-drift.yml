name: Agent drift
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: agent-drift-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  agent-drift:
    uses: BehindTheMusicTree/github-workflows/.github/workflows/agent-drift.yml@c8bb5b9da0269b68c6ded0fb7cda486a1637b208
    permissions:
      contents: read

name: Bench

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

env:
  NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN_READ }}

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5.0.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - uses: CodSpeedHQ/action@v5.6.0
        with:
          mode: simulation
          run: pnpm --filter @behindthemusictree/genre-tree-view bench
          token: ${{ secrets.CODSPEED_TOKEN }}
